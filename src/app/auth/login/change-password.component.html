      <h3 class="text-center mb-3">Login</h3>
        <form [formGroup]="form" (ngSubmit)="onSubmit()">
            <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" formControlName="email" class="form-control" />
            </div>
            <div class="mb-3">
            <label class="form-label">Password Lama</label>
            <input type="password" formControlName="oldPassword" class="form-control" />
            </div>
            <div class="mb-3">
            <label class="form-label">Password Baru</label>
            <input type="password" formControlName="newPassword" class="form-control" />
            </div>
            <div class="mb-3">
            <label class="form-label">Konfirmasi Password</label>
            <input type="password" formControlName="confirmPassword" class="form-control" />
            </div>
            <button type="submit" class="btn btn-primary w-100">Simpan Perubahan</button>
        </form>

      <h3 class="text-center mb-3">Rubah Password</h3>

      <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <div class="mb-3">
          <label class="form-label">Email *</label>
          <input type="email" formControlName="email" class="form-control" placeholder="Masukkan email" />
        </div>

        <div class="mb-3">
          <label class="form-label">Password Lama *</label>
          <input type="password" formControlName="oldPassword" class="form-control" placeholder="Masukkan password lama" />
        </div>
        <div class="mb-3">
          <label class="form-label">Password Baru *</label>
          <input type="password" formControlName="newPassword" class="form-control" placeholder="Masukkan password baru" />
        </div>
        <div class="mb-3">
          <label class="form-label">Konfirmasi Password *</label>
          <input type="password" formControlName="confirmPassword" class="form-control" placeholder="Masukkan konfirmasi password" />
        </div>

        <div *ngIf="successMessage" class="alert alert-success mt-3">
            {{ successMessage }}
        </div>
        <button type="submit" class="btn btn-primary w-100">
          Simpan Perubahan
        </button>
      </form>
    </div>
  </div>

  <div class="w-50 d-flex align-items-center justify-content-center text-white bg-primary">
    <div class="text-center"></div>
  </div>
</div>
