<div class="container mt-4">
  <h4>{{ isEdit ? 'Edit Produk' : 'Tambah Produk' }}</h4>

  <form (ngSubmit)="onSave()" #formRef="ngForm">
    <div class="mb-3">
      <label class="form-label">Kode Produk</label>
      <input
        type="text"
        class="form-control"
        [(ngModel)]="form.code"
        name="code"
        [readonly]="isEdit"
        required
      />
    </div>

    <div class="mb-3">
      <label class="form-label">Nama Produk</label>
      <input
        type="text"
        class="form-control"
        [(ngModel)]="form.name"
        name="name"
        required
      />
    </div>

    <div class="mb-3">
      <label class="form-label">Rata-rata Harga (Average Cost)</label>
      <input
        type="number"
        class="form-control"
        [(ngModel)]="form.averageCost"
        name="averageCost"
        required
      />
    </div>

    <button type="submit" class="btn btn-success me-2">
      {{ isEdit ? 'Simpan Perubahan' : 'Tambah Produk' }}
    </button>
    <button type="button" class="btn btn-secondary" (click)="back()">Batal</button>
  </form>
</div>
