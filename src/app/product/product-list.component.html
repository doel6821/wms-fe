<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h4>Daftar Produk</h4>
    <button class="btn btn-primary" (click)="onAddProduct()">+ Tambah Produk</button>
  </div>

  <div class="mb-3">
    <input
      type="text"
      [(ngModel)]="searchTerm"
      placeholder="Cari berdasarkan nama atau kode produk"
      class="form-control"
    />
  </div>

  <table class="table table-striped table-bordered">
    <thead class="table-light">
      <tr>
        <th>Kode Produk</th>
        <th>Nama Produk</th>
        <th>Average Cost</th>
        <th>Aksi</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let product of filteredProducts">
        <td>{{ product.code }}</td>
        <td>{{ product.name }}</td>
        <td>Rp {{ product.averageCost | number: '1.0-0' }}</td>
        <td>
          <button class="btn btn-sm btn-outline-primary me-2" (click)="goToDetail(product.code)">
            Detail
          </button>
          <button class="btn btn-sm btn-outline-primary" (click)="onEditProduct(product.code)">
            Edit
          </button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
