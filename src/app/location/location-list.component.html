<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h4>Daftar Lokasi Penyimpanan</h4>
    <button class="btn btn-primary" (click)="goToAdd()">+ Tambah Lokasi</button>
  </div>

  <table class="table table-striped">
    <thead>
      <tr>
        <th>Nama Lokasi</th>
        <th>Keterangan</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let l of locations">
        <td>{{ l.name }}</td>
        <td>{{ l.description }}</td>
      </tr>
    </tbody>
  </table>
</div>
