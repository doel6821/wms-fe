<div class="container mt-4">
  <div class="d-flex align-items-center mb-4">
    <button type="button" class="btn btn-link me-3 p-0" (click)="back()">
      <i class="fas fa-arrow-left"></i>
    </button>
    <h4 class="mb-0">{{ isEditMode ? 'Edit Lokasi' : 'Tambah Lokasi Baru' }}</h4>
  </div>

  <!-- Loading State -->
  <div *ngIf="isLoading" class="text-center my-5">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
    <p class="mt-2">Memuat data lokasi...</p>
  </div>

  <!-- Form -->
  <div *ngIf="!isLoading" class="card">
    <div class="card-body">
      <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <!-- <div class="row"> -->
          <div class="col-md-6">
            <div class="mb-3">
              <label class="form-label">
                Nama Lokasi <span class="text-danger">*</span>
              </label>
              <input 
                type="text" 
                class="form-control" 
                formControlName="name"
                [class.is-invalid]="form.get('name')?.touched && form.get('name')?.errors"
                placeholder="Masukkan nama lokasi"
              />
              <div *ngIf="form.get('name')?.touched && form.get('name')?.errors" class="invalid-feedback">
                <div *ngIf="form.get('name')?.errors?.['required']">Nama lokasi wajib diisi</div>
              </div>
            </div>
          </div>
          
          <div class="col-md-6">
            <div class="mb-3">
              <label class="form-label">
                Kode Lokasi <span class="text-danger">*</span>
              </label>
              <input 
                type="text" 
                class="form-control" 
                formControlName="code"
                [class.is-invalid]="form.get('code')?.touched && form.get('code')?.errors"
                placeholder="Masukkan kode lokasi"
              />
              <div *ngIf="form.get('code')?.touched && form.get('code')?.errors" class="invalid-feedback">
                <div *ngIf="form.get('code')?.errors?.['required']">Kode lokasi wajib diisi</div>
              </div>
            </div>
          </div>
        <!-- </div> -->

        <!-- <div class="mb-3">
          <label class="form-label">Keterangan</label>
          <textarea 
            class="form-control" 
            formControlName="description"
            rows="3"
            placeholder="Masukkan keterangan lokasi (opsional)"
          ></textarea>
        </div> -->

        <div class="d-flex gap-2">
          <button 
            type="submit" 
            class="btn btn-primary"
            [disabled]="form.invalid"
          >
            <i class="fas fa-save"></i>
            {{ isEditMode ? 'Update' : 'Simpan' }}
          </button>
          <button 
            type="button" 
            class="btn btn-secondary" 
            (click)="back()"
          >
            <i class="fas fa-times"></i>
            Batal
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
