<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h4>{{ isEditMode ? 'Edit Customer' : 'Tambah Customer' }}</h4>
    <button class="btn btn-secondary" (click)="back()">Kembali</button>
  </div>

  <div *ngIf="isLoading" class="text-center">
    <div class="spinner-border" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
  </div>

  <form [formGroup]="form" (ngSubmit)="onSubmit()" *ngIf="!isLoading">
    <div class="row">
      <div class="col-md-6">
        <div class="mb-3">
          <label class="form-label">Nama Customer *</label>
          <input formControlName="name" class="form-control" placeholder="Masukkan nama customer" />
          <div *ngIf="form.get('name')?.invalid && form.get('name')?.touched" class="text-danger small">
            Nama customer wajib diisi
          </div>
        </div>
      </div>
      
      <div class="col-md-6">
        <div class="mb-3">
          <label class="form-label">Email *</label>
          <input type="email" formControlName="email" class="form-control" placeholder="Masukkan email" />
          <div *ngIf="form.get('email')?.invalid && form.get('email')?.touched" class="text-danger small">
            <span *ngIf="form.get('email')?.hasError('required')">Email wajib diisi</span>
            <span *ngIf="form.get('email')?.hasError('email')">Format email tidak valid</span>
          </div>
        </div>
      </div>
    </div>

    <div class="row">
      <div class="col-md-6">
        <div class="mb-3">
          <label class="form-label">No. HP *</label>
          <input formControlName="phone" class="form-control" placeholder="Masukkan nomor HP" />
          <div *ngIf="form.get('phone')?.invalid && form.get('phone')?.touched" class="text-danger small">
            No. HP wajib diisi
          </div>
        </div>
      </div>
      
      <div class="col-md-6">
        <div class="mb-3">
          <label class="form-label">Diskon (%)</label>
          <input type="number" formControlName="discountPercent" class="form-control" placeholder="0" min="0" max="100" />
        </div>
      </div>
    </div>

    <div class="mb-3">
      <label class="form-label">Alamat</label>
      <textarea formControlName="address" class="form-control" rows="3" placeholder="Masukkan alamat lengkap"></textarea>
    </div>

    <div class="row">
      <div class="col-md-6">
        <div class="mb-3">
          <label class="form-label">Term of Payment *</label>
          <select formControlName="termOfPayment" class="form-control">
            <option value="">Pilih term pembayaran</option>
            <option value="cash">Cash</option>
            <option value="7 hari">Kredit 7 hari</option>
            <option value="15 hari">Kredit 15 hari</option>
            <option value="30 hari">Kredit 30 hari</option>
          </select>
          <div *ngIf="form.get('termOfPayment')?.invalid && form.get('termOfPayment')?.touched" class="text-danger small">
            Term of payment wajib dipilih
          </div>
        </div>
      </div>
      
      <div class="col-md-6">
        <div class="mb-3">
          <div class="form-check mt-4">
            <input type="checkbox" formControlName="cancelOnBackOrder" class="form-check-input" id="cancelOnBackOrder">
            <label class="form-check-label" for="cancelOnBackOrder">
              Cancel on Back Order
            </label>
          </div>
        </div>
      </div>
    </div>

    <div class="d-flex gap-2">
      <button type="submit" class="btn btn-primary" [disabled]="form.invalid">
        {{ isEditMode ? 'Update' : 'Simpan' }}
      </button>
      <button type="button" class="btn btn-secondary" (click)="back()">Batal</button>
    </div>
  </form>
</div>
