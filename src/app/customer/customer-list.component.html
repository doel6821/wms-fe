<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h4>Daftar Pelanggan</h4>
    <button class="btn btn-primary" (click)="goToAdd()">+ Tambah Pelanggan</button>
  </div>
  <div class="card mb-3">
    <div class="card-body">
      <form [formGroup]="form" class="row g-3">
        <div class="col-md-4">
          <label class="form-label">Nama Pelanggan:</label>
          <input
            type="text"
            class="form-control"
            formControlName="customerName"
            placeholder="Masukkan nama pelanggan"
          />
        </div>
      
        <div class="col-md-4 d-flex align-items-end">
          <div class="btn-group w-100">
            <button type="button" class="btn btn-primary" (click)="onFilter()">
              <i class="fas fa-search"></i> Filter
            </button>
            <button type="button" class="btn btn-secondary" (click)="resetFilter()">
              <i class="fas fa-refresh"></i> Reset
            </button>
          </div>
        </div>
      </form>
    </div>
  </div>
  
  <div>
    <table class="table table-striped">
      <thead>
        <tr>
          <th>Nama</th>
          <th>No. HP</th>
          <th>Diskon (%)</th>
          <th>Term</th>
          <th>Aksi</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let c of customers">
          <td>{{ c.name }}</td>
          <td>{{ c.phone }}</td>
          <td>{{ c.discountPercent }}%</td>
          <td>{{ c.termOfPayment }}</td>
          <td>
            <!-- <button class="btn btn-sm btn-info me-2" (click)="c.id && goToEdit(c.id)">Edit</button> -->
            <div class="btn-group">
              <button class="btn btn-sm btn-outline-info" (click)="goToDetail(c.id!)">
                <i class="fas fa-eye"></i> Detail
              </button>
              <button class="btn btn-sm btn-outline-warning" (click)="goToEdit(c.id!)">
                <i class="fas fa-edit"></i> Edit
              </button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
    <!-- Pagination -->
    <nav *ngIf="totalRecord">
      <ul class="pagination">
        <li class="page-item" [class.disabled]="currPage === 1">
          <a class="page-link" (click)="onPageChange(currPage - 1)">Previous</a>
        </li>
        <li class="page-item disabled">
          <span class="page-link">
            Page {{ currPage }} of {{ Math.ceil(totalData / totalRecord) }}
          </span>
        </li>
        <li class="page-item" [class.disabled]="currPage * totalRecord >= totalData">
          <a class="page-link" (click)="onPageChange(currPage + 1)">Next</a>
        </li>
      </ul>
    </nav>
  </div>
  
  
</div>
