<div class="container mt-4">
  <div class="d-flex align-items-center mb-4">
    <button type="button" class="btn btn-link me-3 p-0" (click)="back()">
      <i class="fas fa-arrow-left"></i>
    </button>
    <h4 class="mb-0">Rincian Pengaturan</h4>
  </div>

  <!-- Loading State -->
  <div *ngIf="isLoading" class="text-center my-5">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
    <p class="mt-2">Memuat detail pengaturan...</p>
  </div>

  <!-- Pengaturan Detail -->
  <div *ngIf="!isLoading" class="card">
    <div class="card-header d-flex justify-content-between align-items-center">
      <h5 class="mb-0">{{ config.name }}</h5>
      <div class="btn-group" role="group">
        <button type="button" class="btn btn-outline-warning btn-sm" (click)="goToEdit()">
          <i class="fas fa-edit"></i> Edit
        </button>
      </div>
    </div>
    <div class="card-body">
      <div class="row">
        <div class="col-md-6">
          <div class="mb-3">
            <label class="form-label text-muted">Nama Pengaturan</label>
            <p class="fw-bold">{{ config.name || '-' }}</p>
          </div>
          <div class="mb-3">
            <label class="form-label text-muted">Keterangan</label>
            <p class="fw-bold">{{ config.description || '-' }}</p>
          </div>
          <div class="mb-3">
            <label class="form-label text-muted">Nilai</label>
            <p class="fw-bold">{{ config.value || '-' }}</p>
          </div>
        </div>
      </div>
    </div>
    <div class="card-footer">
      <div class="d-flex gap-2">
        <button type="button" class="btn btn-warning" (click)="goToEdit()">
          <i class="fas fa-edit"></i> Edit Pengaturan
        </button>
        <button type="button" class="btn btn-secondary" (click)="back()">
          <i class="fas fa-arrow-left"></i> Kembali ke Daftar
        </button>
      </div>
    </div>
  </div>
</div>
