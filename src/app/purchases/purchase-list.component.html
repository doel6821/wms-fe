<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h4>Daftar Pembelian</h4>
    <button class="btn btn-primary" (click)="goToAdd()">+ Tambah Pembelian</button>
  </div>

  <!-- Filter Section -->
  <div class="card mb-3">
    <div class="card-body">
      <form [formGroup]="form" class="row g-3">
        <div class="col-md-4">
          <label class="form-label">Nama Supplier</label>
          <input type="text" class="form-control" formControlName="supplierName" placeholder="Masukkan nama supplier">
        </div>
        <div class="col-md-8 d-flex align-items-end">
          <button type="button" class="btn btn-primary me-2" (click)="onFilter()">Filter</button>
          <button type="button" class="btn btn-secondary" (click)="resetFilter()">Reset</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Loading indicator -->
  <div *ngIf="isLoading" class="text-center">
    <div class="spinner-border" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
  </div>

  <!-- Data Table -->
  <div class="card">
    <div class="card-body">
      <div class="table-responsive">
        <table class="table table-striped">
          <thead>
            <tr>
              <!-- <th>ID</th> -->
              <th>Tanggal Pembelian</th>
              <th>Supplier</th>
              <th>Jumlah Barang</th>
              <th>Jumlah Pembelanjaan</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let p of purchases" [ngClass]="{ 'table-secondary': isLoading }">
              <!-- <td>{{ p.id }}</td> -->
              <td>{{ p.orderDate |  date:'dd/MM/yyyy' }}</td>
              <td>{{ p.supplier.name }}</td>
              <td>{{ p.items.length | number }}</td>
              <td>Rp {{ p.totalAmount | number }}</td>
              <td>
                <div class="btn-group btn-group-sm" role="group">
                  <button class="btn btn-info" (click)="goToDetail(p.id)">Detail</button>
                </div>
              </td>
            </tr>
            <tr *ngIf="purchases.length === 0 && !isLoading">
              <td colspan="6" class="text-center">Tidak ada data purchase order</td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- Pagination -->
      <nav *ngIf="totalData > totalRecord" aria-label="Page navigation">
        <ul class="pagination justify-content-center">
          <li class="page-item" [class.disabled]="currPage === 1">
            <button class="page-link" (click)="onPageChange(currPage - 1)" [disabled]="currPage === 1">Previous</button>
          </li>
          <li *ngFor="let page of [].constructor(Math.ceil(totalData / totalRecord)); let i = index" 
              class="page-item" [class.active]="currPage === i + 1">
            <button class="page-link" (click)="onPageChange(i + 1)">{{ i + 1 }}</button>
          </li>
          <li class="page-item" [class.disabled]="currPage === Math.ceil(totalData / totalRecord)">
            <button class="page-link" (click)="onPageChange(currPage + 1)" 
                    [disabled]="currPage === Math.ceil(totalData / totalRecord)">Next</button>
          </li>
        </ul>
      </nav>
    </div>
  </div>
</div>
