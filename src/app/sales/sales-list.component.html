<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h4>Daftar Penjualan</h4>
    <button class="btn btn-primary" (click)="goToAdd()">+ Tambah Penjualan</button>
  </div>

  <table class="table table-striped">
    <thead class="table-light">
      <tr>
        <th>Kode</th>
        <th>Customer</th>
        <th>Tanggal</th>
        <th>Total</th>
        <th>Aksi</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let sale of sales">
        <td>{{ sale.code }}</td>
        <td>{{ sale.customer }}</td>
        <td>{{ sale.date }}</td>
        <td>Rp {{ sale.total | number:'1.0-0' }}</td>
        <td>
          <button class="btn btn-sm btn-outline-info" (click)="goToDetail(sale.id)">Detail</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
