<div class="container mt-4">
  <h4>Tambah Penjualan</h4>

  <form (ngSubmit)="onSubmit()">
    <div class="mb-3">
      <label class="form-label">Tanggal</label>
      <input type="date" class="form-control" [(ngModel)]="sale.date" name="date" required />
    </div>

    <div class="mb-3">
      <label class="form-label">Customer</label>
      <select class="form-select" [(ngModel)]="sale.customer" name="customer" required>
        <option value="">Pilih Customer</option>
        <option *ngFor="let c of customers" [value]="c">{{ c }}</option>
      </select>
    </div>

    <hr />
    <h5>Tambah Produk</h5>
    <div class="row g-2 align-items-center mb-3">
      <div class="col-md-5">
        <select class="form-select" [(ngModel)]="newItem.productCode" name="productCode">
          <option value="">Pilih Produk</option>
          <option *ngFor="let p of products" [value]="p.code">
            {{ p.code }} - {{ p.name }}
          </option>
        </select>
      </div>
      <div class="col-md-3">
        <input type="number" class="form-control" [(ngModel)]="newItem.qty" name="qty" min="1" />
      </div>
      <div class="col-md-2">
        <button type="button" class="btn btn-success w-100" (click)="addItem()">+ Tambah</button>
      </div>
    </div>

    <table class="table table-bordered">
      <thead class="table-light">
        <tr>
          <th>Kode</th>
          <th>Nama Produk</th>
          <th>Harga</th>
          <th>Qty</th>
          <th>Total</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let item of sale.items; let i = index">
          <td>{{ item.code }}</td>
          <td>{{ item.name }}</td>
          <td>Rp {{ item.price | number }}</td>
          <td>{{ item.qty }}</td>
          <td>Rp {{ item.total | number }}</td>
          <td>
            <button class="btn btn-sm btn-danger" (click)="removeItem(i)">Hapus</button>
          </td>
        </tr>
      </tbody>
    </table>

    <h5>Total: Rp {{ totalAmount | number }}</h5>

    <button type="submit" class="btn btn-primary me-2">Simpan Penjualan</button>
    <button type="button" class="btn btn-secondary" (click)="back()">Batal</button>
  </form>
</div>
