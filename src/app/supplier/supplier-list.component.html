<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h4>Daftar Supplier</h4>
    <button class="btn btn-primary" (click)="goToAdd()">+ Tambah Supplier</button>
  </div>
  <div class="card mb-3">
    <div class="card-body">
      <form [formGroup]="form" class="row g-3">
        <div class="col-md-4">
          <label class="form-label">Nama Supplier:</label>
          <input
            type="text"
            class="form-control"
            formControlName="supplierName"
            placeholder="Masukkan nama supplier"
          />
        </div>
      
        <div class="col-md-4 d-flex align-items-end">
          <div class="btn-group w-100">
            <button type="button" class="btn btn-primary" (click)="onFilter()">
              <i class="fas fa-search"></i> Filter
            </button>
            <button type="button" class="btn btn-secondary" (click)="resetFilter()">
              <i class="fas fa-refresh"></i> Reset
            </button>
          </div>
        </div>
      </form>
    </div>
  </div>
  
  <div>
    <div *ngIf="isLoading" class="d-flex justify-content-center my-3">
      <div class="spinner-border" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
    </div>
    <table class="table table-striped" *ngIf="!isLoading">
      <thead>
        <tr>
          <th>Nama</th>
          <th>No. HP</th>
          <th>Perkiraan Diskon (%)</th>
          <th>Term</th>
          <th>Lead Time</th>
          <th>Aksi</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let s of suppliers">
          <td>{{ s.name }}</td>
          <td>{{ s.phone }}</td>
          <td>{{ s.discountPercent }}%</td>
          <td>{{ s.termOfPayment }}</td>
          <td>{{ s.leadTimeDays }}</td>
          <td>
            <div class="btn-group">
              <button class="btn btn-sm btn-outline-info" (click)="goToDetail(s.id!)">
                <i class="fas fa-eye"></i> Detail
              </button>
              <button class="btn btn-sm btn-outline-warning" (click)="goToEdit(s.id!)">
                <i class="fas fa-edit"></i> Edit
              </button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
    <!-- Pagination -->
    <nav *ngIf="totalRecord && !isLoading">
      <ul class="pagination">
        <li class="page-item" [class.disabled]="currPage === 1">
          <a class="page-link" (click)="onPageChange(currPage - 1)">Previous</a>
        </li>
        <li class="page-item disabled">
          <span class="page-link">
            Page {{ currPage }} of {{ Math.ceil(totalData / totalRecord) }}
          </span>
        </li>
        <li class="page-item" [class.disabled]="currPage * totalRecord >= totalData">
          <a class="page-link" (click)="onPageChange(currPage + 1)">Next</a>
        </li>
      </ul>
    </nav>
  </div>
</div>
