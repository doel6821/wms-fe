<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h4>Daftar Supplier</h4>
    <button class="btn btn-primary" (click)="goToAdd()">+ Tambah Supplier</button>
  </div>

  <table class="table table-striped">
    <thead>
      <tr>
        <th>Nama</th>
        <th>Telepon</th>
        <th>Alamat</th>
        <th>Aksi</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let s of suppliers">
        <td><a href="#" (click)="goToDetail(s.id); $event.preventDefault()">{{ s.name }}</a></td>
        <td>{{ s.phone }}</td>
        <td>{{ s.address }}</td>
        <td>
          <button class="btn btn-sm btn-info me-2" (click)="goToEdit(s.id)">Edit</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
